name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install core and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Python syntax
        run: python -m compileall -q weldvision tests
      - name: Core regression tests on Linux
        if: runner.os == 'Linux'
        run: python -m pytest -q -ra tests --ignore=tests/test_gui_optional.py --ignore=tests/test_measurements_gui.py --basetemp=pytest_temp
      - name: Full PyQt6 regression tests on Windows
        if: runner.os == 'Windows'
        run: python -m pytest -q -ra tests --basetemp=pytest_temp
